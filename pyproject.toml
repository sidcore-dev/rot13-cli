[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rot13-cli"
version = "1.0.0"
description = "Classic ROT13 / generalized Caesar cipher text transform for the command line, with no dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "All Rights Reserved" }
authors = [{ name = "sidcore-dev" }]
keywords = ["rot13", "caesar-cipher", "cli", "devtools", "text"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Environment :: Console",
    "Topic :: Utilities",
]

[project.scripts]
rot13-cli = "rot13_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
